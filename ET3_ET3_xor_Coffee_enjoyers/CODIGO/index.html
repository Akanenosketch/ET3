	<script type="text/javascript">

		function evento(event) {
			const menu = document.getElementById('div-menu');
			const menuToggleButton = document.getElementById('botonMENU');

			// Si el clic no fue dentro del menú ni en el botón para abrir el menú, cerramos el menú
			if (!menu.contains(event.target) && event.target !== menuToggleButton) {
				menu_work();
			}
		}

		function menu_work() {
			if (document.getElementById('div-menu').style.display == 'none') {
				document.getElementById('div-menu').style.display = 'block';
				// Cerrar el menú si se hace clic fuera de él
				document.addEventListener('click', evento);

			}
			else {
				document.getElementById('div-menu').style.display = 'none';
				document.removeEventListener('click', evento);

			}
		}

		document.getElementById('div-menu').style.display = 'none';
		document.getElementById('div_IU_form').style.display = 'none';
		document.getElementById('id_tabla_datos').style.display = 'none';
		document.getElementById('title_page').style.display = 'none';
		document.getElementById('botonTEST').style.display = 'none';
		document.getElementById('div_IU_test').style.display = 'none';
		// poner no visible el modal de error de accion
		document.getElementById('error_action_modal').style.display = 'none';


		let datos = eval("def_grupo_ET3_xor_Coffee_enjoyers");
		document.getElementById('divTablasDatosEntrega').style.display = 'block';
		let headersEntrega = `<tr class="parteSuperior1">
        	<th class="Nombre Grupo">Nombre Grupo</th>
        	<th class="Entrega">Entrega</th>
        	<th class="Horas Totales">Horas Totales</th>
        	</tr>`;
		document.getElementById('salidaDatosEntrega').innerHTML = headersEntrega;
		let headersPersonas = `<tr>
        	<th class="Nombre Integrante">Nombre Integrante</th>
        	<th class="Horas">Horas</th>
        	</tr>`;
		document.getElementById('salidaDatosEntregaPersonas').innerHTML = headersPersonas;

		let datosEntrega = `<tr>
            <td>`+ datos[1] + `</td>
            <td>`+ datos[0] + `</td>
            <td>`+ datos[4] + `</td>
            </tr>`;
		document.getElementById('salidaDatosEntrega').innerHTML += datosEntrega;

		let datosPersona = "";
		for (let i = 0; i < datos[2].length; i++) {
			datosPersona += `<tr>
            <td>`+ datos[2][i] + `</td>
            <td>`+ datos[3][i] + `</td>
            </tr>`;
		}
		document.getElementById('salidaDatosEntregaPersonas').innerHTML += datosPersona;
		setLang('');




		function toggleTheme() {
			const body = document.body;

			// Verificar si está en modo oscuro antes de cambiar
			const isDarkMode = body.classList.contains('darkmode');
			const actions = ['SEARCH', 'ADD', 'BACK', 'MENU', 'API', 'ESTRUCTURAS', 'TEST', 'SIG', 'ANT'];  // Asegúrate de incluir todas las acciones que usas en tu página

			// Cambiar entre modo claro y oscuro
			if (isDarkMode) {
				body.classList.remove('darkmode');
				body.classList.add('lightmode');
			} else {
				body.classList.remove('lightmode');
				body.classList.add('darkmode');
			}

			// Actualizar las imágenes después de cambiar el tema
			actions.forEach(action => {
				const botones = document.querySelectorAll(`[id^="boton${action}"]`);  // Obtener todos los botones que empiezan con "boton" + acción
				botones.forEach(boton => {
					if (body.classList.contains('darkmode')) {
						boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
					} else {
						boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
					}
					boton.style.width = '40px';
					boton.style.height = '40px';
				});
			});
		}



		document.addEventListener('DOMContentLoaded', () => {
			const body = document.body;
			const toggle = document.getElementById('themeToggle');
			const actions = ['SEARCH', 'ADD', 'BACK', 'MENU', 'API', 'ESTRUCTURAS', 'TEST', 'SIG', 'ANT'];

			// Establecer modo claro por defecto
			body.classList.remove('darkmode');
			body.classList.add('lightmode');

			// Sincronizar el estado del toggle (asegura que el botón esté en la posición "apagado")
			toggle.checked = false;

			actions.forEach(action => {
				const botones = document.querySelectorAll(`[id^="boton${action}"]`);  // Obtener todos los botones que empiezan con "boton" + acción
				botones.forEach(boton => {
					if (body.classList.contains('darkmode')) {
						boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
					} else {
						boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
					}
					boton.style.width = '40px';
					boton.style.height = '40px';
				});
			});
		});




		function changeImageOnHover(isMouseOver, action,aux = "") {
			const body = document.body;
						boton.src = `./iconos/${action}(naranja).png`;  // Otra imagen al pasar el mouse en modo claro
					}
					boton.style.width = '40px';
					boton.style.height = '40px';
				} else {
					// Cuando el mouse sale de la imagen, la restauramos según el modo
					if (body.classList.contains('darkmode')) {
						boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
					} else {
						boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
					}
					boton.style.width = '40px';
					boton.style.height = '40px';
				}
			});
		}


	</script>
