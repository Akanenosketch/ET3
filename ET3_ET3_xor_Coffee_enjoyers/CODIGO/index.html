<!DOCTYPE html>
<html>

<head>

	<meta charset="UTF-8">
	<!-- Igual el linkeo este hay que cambiarlo no estoy seguro, solo le cambie el nombre del archivo -->
	<link rel="stylesheet" type="text/css" href="./css/IU.css" media="screen" />

	<!-- ficheros de idiomas -->
	<script type="text/javascript" src="./locale/idioma.js"></script>
	<script type="text/javascript" src="./js_app/Textos_ES.js"></script>
	<script type="text/javascript" src="./js_app/Textos_EN.js"></script>

	<!-- clases auxiliares -->
	<script type="text/javascript" src="./js_core/Validaciones_Atomicas.js"></script>
	<script type="text/javascript" src="./js_core/ExternalAccess.js"></script>
	<script type="text/javascript" src="./js_app/colocador_valores.js"></script>
	<script type="text/javascript" src="./js_app/constructor_form.js"></script>
	<script type="text/javascript" src="./js_app/constructor_validaciones.js"></script>

	<!-- arbol de clases de entidades -->
	<script type="text/javascript" src="./js_core/Tests_class.js"></script>
	<script type="text/javascript" src="./js_core/DOM_class.js"></script>
	<script type="text/javascript" src="./js_base/EntidadAbstracta.js"></script>

	<script type="text/javascript" src="./js_app/estructura_analysis_preparation.js"></script>
	<script type="text/javascript" src="./js_app/analysis_preparation.js"></script>

	<script type="text/javascript" src="./js_app/estructura_project.js"></script>
	<script type="text/javascript" src="./js_app/project.js"></script>

	<script type="text/javascript" src="./js_app/estructura_characteristic.js"></script>
	<script type="text/javascript" src="./js_app/characteristic.js"></script>

	<!-- Tests de entidades -->
	<script type="text/javascript" src="./js_app/tests_analysis_preparation.js"></script>
	<script type="text/javascript" src="./js_app/tests_project.js"></script>
	<script type="text/javascript" src="./js_app/tests_characteristic.js"></script>

	<!-- Hace falta cargar los html del API y estructuras?-->

	<!-- Fichero de datos-->
	<script type="text/javascript" src="./ET3_Datos_ET3_xor_Coffee_enjoyers.js"></script>

	<!-- este es el script que carga las librerias ajax que usamos para acceder al back -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body onload="">

	<header id='header_page' class='bordeado'>
		<spam class="text_titulo_app"></spam>

		<!-- Select para cambiar idiomas -->
		<select id="languageSelect" onchange="setLang(this.value);">
			<option value="ES" class="idiomaES"></option>
			<option value="EN" class="idiomaEN"></option>
		</select>

		<img id="botonTEST" src="./iconos/TEST.png" onclick="validar.test_run();" />
	</header>

	<nav class='bordeado'><span class="text_titulo_menu" onclick="menu_work();"></span></nav>

	<aside id='div-menu'>
		<ol>
			<li class="opcionmenu"><span class="text_project" onclick="validar = new project();"></span></li>
			<li class="opcionmenu"><span class="text_analysis_prep"
					onclick="validar = new analysis_preparation();"></span></li>
			<li class="opcionmenu"><span class="text_characteristic"
					onclick="validar = new characteristic();">Traduceme</span></li>

		</ol>
	</aside>

	<section id="workspace" class='bordeado'>

		<div id='title_page' class='bordeado'>
			<spam id="text_title_page" class="">titulo de pagina de entidad</spam>
		</div>

		<div id="id_tabla_datos">

			<div id="addysearch">
				<img id="botonADD" src="./iconos/ADD.png" onclick="validar.createForm('ADD');" />
				<img id="botonSEARCH" src="./iconos/SEARCH.png" onclick="validar.createForm('SEARCH');" />

				<select id="seleccioncolumnas" size="2" multiple>
				</select>

			</div>

			<table id="tabladatosalumnos">
				<thead id="titulostablacabecera"></thead>
				<tbody id="muestradatostabla"></tbody>
			</table>

			<br>
			<img src="./iconos/BACK.png" onclick="validar.cerrar_tabla();" />

		</div>

	</section>

	<div class="div_IU_form" id='div_IU_form'>

		<div class="contenidoForm" id="contenidoForm">
			<div class="class_titulo_form">
				<spam id="class_contenido_titulo_form" class="">titulo para el formulario de entidad</spam>
			</div>

			<form id='IU_form' name='IU_form' method='POST' enctype="multipart/form-data" class="formulario">

			</form>
			<br>
			<img src="./iconos/BACK.png" onclick="validar.cerrar_formulario();" />
		</div>

	</div>


	<div class="contenidoForm" id='div_IU_test'>

		<div class="" id="contenidoTests">
			<h1 id="res_estructura_tests"></h1>
			<p id="resultadodef"></p>
			<table border="1">
				<tbody id="tablaresultadostest">
				</tbody>
			</table>
		</div>

		<div class="" id="contenidoPruebas">
			<h1 id="res_estructura_pruebas"></h1>
			<p id="resultadoprueba"></p>
			<div id="div_tabla_prueba">
				<table id="tabla_prueba" border="1">
					<tbody id="tablaresultadosprueba">
					</tbody>
				</table>
			</div>
		</div>

		<div class="" id="resultadopruebas">
			<h1 id="res_pruebas"></h1>
			<p id="resultadotest"></p>
			<div id="div_resultado_prueba">
				<table id="resultado_prueba" border="1">
					<tbody id="salidaresultadosprueba">
					</tbody>
				</table>

			</div>
		</div>

		<img src="./iconos/BACK.png" onclick="validar.cerrar_test();" />

	</div>



	<footer class='bordeado'>
		<spam class="text_titulo_pie"></spam>
		<div id="divTablasDatosEntrega">
			<table>
				<tbody id="salidaDatosEntrega">
				</tbody>
			</table>
			<table>
				<tbody id="salidaDatosEntregaPersonas">
				</tbody>
			</table>

		</div>
	</footer>

	<!-- Overlay para acompañar el modal -->
	<div id="modal_action_overlay"></div>

	<!-- Modal para mostrar los errores de accion -->
	<div id="error_action_modal">
		<span id="error_action_msg"></span>
		<!--<img src="./iconos/BACK.png" onclick="cerrarModalError();" />-->
		<button onclick="validar.cerrarModalError()">X</button>
	</div>

	<script type="text/javascript">

		function menu_work() {
			if (document.getElementById('div-menu').style.display == 'none') {
				document.getElementById('div-menu').style.display = 'block';
			}
			else {
				document.getElementById('div-menu').style.display = 'none';
			}
		}
		document.getElementById('div-menu').style.display = 'none';
		document.getElementById('div_IU_form').style.display = 'none';
		document.getElementById('id_tabla_datos').style.display = 'none';
		document.getElementById('title_page').style.display = 'none';
		document.getElementById('botonTEST').style.display = 'none';
		document.getElementById('div_IU_test').style.display = 'none';
		// poner no visible el modal de error de accion
		document.getElementById('error_action_modal').style.display = 'none';


		let datos = eval("def_grupo_ET3_xor_Coffee_enjoyers");
		document.getElementById('divTablasDatosEntrega').style.display = 'block';
		let headersEntrega = `<tr>
        	<th class="Nombre Grupo">Nombre Grupo</th>
        	<th class="Entrega">Entrega</th>
        	<th class="Horas Totales">Horas Totales</th>
        	</tr>`;
		document.getElementById('salidaDatosEntrega').innerHTML = headersEntrega;
		let headersPersonas = `<tr>
        	<th class="Nombre Integrante">Nombre Integrante</th>
        	<th class="Horas">Horas</th>
        	</tr>`;
		document.getElementById('salidaDatosEntregaPersonas').innerHTML = headersPersonas;

		let datosEntrega = `<tr>
            <td>`+ datos[1] + `</td>
            <td>`+ datos[0] + `</td>
            <td>`+ datos[4] + `</td>
            </tr>`;
		document.getElementById('salidaDatosEntrega').innerHTML += datosEntrega;

		let datosPersona = "";
		for (let i = 0; i < datos[2].length; i++) {
			datosPersona += `<tr>
            <td>`+ datos[2][i] + `</td>
            <td>`+ datos[3][i] + `</td>
            </tr>`;
		}
		document.getElementById('salidaDatosEntregaPersonas').innerHTML += datosPersona;
		setLang('');

	</script>

</body>


</html>
