    <script type="text/javascript">

        function evento(event) {
            const menu = document.getElementById('div-menu');
            const menuToggleButton = document.getElementById('botonMENU');

            // Si el clic no fue dentro del menú ni en el botón para abrir el menú, cerramos el menú
            if (!menu.contains(event.target) && event.target !== menuToggleButton) {
                menu_work();
            }
        }

        function menu_work() {
            if (document.getElementById('div-menu').style.display == 'none') {
                document.getElementById('div-menu').style.display = 'block';
                // Cerrar el menú si se hace clic fuera de él
                document.addEventListener('click', evento);

            }
            else {
                document.getElementById('div-menu').style.display = 'none';
                document.removeEventListener('click', evento);

            }
        }
        document.getElementById('div-menu').style.display = 'none';

        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('themeToggle');
            const body = document.body;

            // Establecer modo claro por defecto
            body.classList.remove('darkmode');
            body.classList.add('lightmode');

            // Sincronizar el estado del toggle
            toggle.checked = false; // Asegurarse de que el botón esté en la posición "apagado"
        });


        function toggleTheme() {
            const body = document.body;

            // Verificar si está en modo oscuro antes de cambiar
            const isDarkMode = body.classList.contains('darkmode');
            const actions = ['ESTRUCTURAS', 'HOME', 'MENU'];  // Asegúrate de incluir todas las acciones que usas en tu página

            // Cambiar entre modo claro y oscuro
            if (isDarkMode) {
                body.classList.remove('darkmode');
                body.classList.add('lightmode');
            } else {
                body.classList.remove('lightmode');
                body.classList.add('darkmode');
            }

            // Actualizar las imágenes después de cambiar el tema
            actions.forEach(action => {
                const boton = document.getElementById("boton" + action);
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/`+action+`(gris).png`;  // Imagen para modo oscuro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/`+action+`.png`;  // Imagen para modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            });
        }


        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            const actions = ['ESTRUCTURAS', 'HOME', 'MENU'];

            // Establecer modo claro por defecto
            body.classList.remove('darkmode');
            body.classList.add('lightmode');

            // Sincronizar el estado del toggle (asegura que el botón esté en la posición "apagado")
            toggle.checked = false;

            actions.forEach(action => {

                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            });

        });



        function changeImageOnHover(isMouseOver, action) {
            const body = document.body;
            const boton = document.getElementById(`boton`+action);  // Usar el nombre de la acción para identificar el botón

            if (isMouseOver) {
                // Si el mouse está sobre la imagen, la cambiamos
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/`+action+`(naranja).png`;  // Imagen oscura al pasar el mouse
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/`+action+`(naranja).png`;  // Otra imagen al pasar el mouse en modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            } else {
                // Cuando el mouse sale de la imagen, la restauramos según el modo
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/`+action+`(gris).png`;  // Imagen para modo oscuro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/`+action+`.png`;  // Imagen para modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            }
        }
