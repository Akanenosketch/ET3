<body onload="" class="darkmode">

    <header id="header_page" class="bordeado">

        <nav class="navbar">
            <img id="botonMENU" src="./iconos/MENU.png" onclick="menu_work();"
                onmouseover="changeImageOnHover(true, 'MENU');" onmouseout="changeImageOnHover(false, 'MENU');" />
        </nav>

        <aside id="div-menu">
            <h2 class="text_titulo_menu"></h2>
            <ol class="no-style">
                <li class="opcionmenu"><span class="text_project"
                        onclick="validar = showEstructura('project'); menu_work();"></span></li>
                <li class="opcionmenu"><span class="text_analysis_prep"
                        onclick="validar = showEstructura('analysis_preparation'); menu_work();"></span></li>
                <li class="opcionmenu"><span class="text_characteristic"
                        onclick="validar = showEstructura('characteristic'); menu_work();"></span>
                </li>
            </ol>

        </aside>

        <spam class="text_titulo_app"></spam>

        <div class="opciones">
            <a href="API.html" class="conjuntoAPI">
                <img id="botonAPI" src="./iconos/API.png" onmouseover="changeImageOnHover(true, 'API');"
                    onmouseout="changeImageOnHover(false, 'API');"/>
                <span class="API" onmouseover="changeImageOnHover(true, 'API');"
                onmouseout="changeImageOnHover(false, 'API');"></span>
            </a>
            <a href="index.html" class="conjuntoINDEX">
                <img id="botonHOME" src="./iconos/HOME.png" onclick="validar.cerrar_tabla();"
                    onmouseover="changeImageOnHover(true, 'HOME');" onmouseout="changeImageOnHover(false, 'HOME');" />
                <span class="pagina_principal" onmouseover="changeImageOnHover(true, 'HOME');"
                onmouseout="changeImageOnHover(false, 'HOME');"></span>
            </a>
        </div>

        <!-- Select para cambiar idiomas -->
        <select id="languageSelect" onchange="setLang(this.value);">
            <option value="ES" class="idiomaES"></option>
            <option value="EN" class="idiomaEN"></option>
        </select>


    </header>

    <div id="workspace" class="bordeado">
        <div id="title_page" class="bordeado">
            <spam id="text_title_page" class="text_title_page_default_structures"></spam>
        </div>

        <div id="structInfo">
            <p class="InfoTextStruct1"></p>
            <p class="InfoTextStruct2"></p>
        </div>
    </div>


    <footer id="footer_page">
        <spam class="text_titulo_pie"></spam>
    </footer>


    <input type="checkbox" class="toggle" id="themeToggle" onclick="toggleTheme()">
	<div class="display">
		<label for="themeToggle" class="theme-label">
			<div class="circle">
				<img class="sun" src="./iconos/SUN.png" height='16px' />
				<img class="moon" src="./iconos/MOON.png" height='16px' />
			</div>
		</label>
	</div>

    <script type="text/javascript">

        function evento(event) {
            const menu = document.getElementById("div-menu");
            const menuToggleButton = document.getElementById("botonMENU");

            // Si el clic no fue dentro del menú ni en el botón para abrir el menú, cerramos el menú
            if (!menu.contains(event.target) && event.target !== menuToggleButton) {
                menu_work();
            }
        }

        function menu_work() {
            if (document.getElementById("div-menu").style.display == "none") {
                document.getElementById("div-menu").style.display = "block";
                // Cerrar el menú si se hace clic fuera de él
                document.addEventListener("click", evento);

            }
            else {
                document.getElementById("div-menu").style.display = "none";
                document.removeEventListener("click", evento);

            }
        }
        document.getElementById("div-menu").style.display = "none";


        document.addEventListener("DOMContentLoaded", () => {
            const toggle = document.getElementById("themeToggle");
            const body = document.body;

            // Establecer modo claro por defecto
            body.classList.remove("darkmode");
            body.classList.add("lightmode");

            // Sincronizar el estado del toggle
            toggle.checked = false; // Asegurarse de que el botón esté en la posición "apagado"
        });


        function toggleTheme() {
            const body = document.body;

            // Verificar si está en modo oscuro antes de cambiar
            const isDarkMode = body.classList.contains('darkmode');
            const actions = ['API', 'HOME', 'MENU'];  // Asegúrate de incluir todas las acciones que usas en tu página

            // Cambiar entre modo claro y oscuro
            if (isDarkMode) {
                body.classList.remove('darkmode');
                body.classList.add('lightmode');
            } else {
                body.classList.remove('lightmode');
                body.classList.add('darkmode');
            }

            // Actualizar las imágenes después de cambiar el tema
            actions.forEach(action => {
                const boton = document.getElementById("boton" + action);
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            });
        }


        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            const actions = ['API', 'HOME', 'MENU'];

            // Establecer modo claro por defecto
            body.classList.remove('darkmode');
            body.classList.add('lightmode');

            // Sincronizar el estado del toggle (asegura que el botón esté en la posición "apagado")
            toggle.checked = false;

            actions.forEach(action => {
                const boton = document.getElementById("boton" + action);
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            });

        });



        function changeImageOnHover(isMouseOver, action) {
            const body = document.body;
            const boton = document.getElementById(`boton${action}`);  // Usar el nombre de la acción para identificar el botón

            if (isMouseOver) {
                // Si el mouse está sobre la imagen, la cambiamos
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/${action}(naranja).png`;  // Imagen oscura al pasar el mouse
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/${action}(naranja).png`;  // Otra imagen al pasar el mouse en modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            } else {
                // Cuando el mouse sale de la imagen, la restauramos según el modo
                if (body.classList.contains('darkmode')) {
                    boton.src = `./iconos/${action}(gris).png`;  // Imagen para modo oscuro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                } else {
                    boton.src = `./iconos/${action}.png`;  // Imagen para modo claro
                    boton.style.width = '40px';
                    boton.style.height = '40px';
                }
            }
        }

        // Posiblemente se moverán a un arhcivo aparte
        function showEstructura(entity) {
            document.getElementById("text_title_page").className = "text_titulo_page_estructura_" + entity;
            document.getElementById("structInfo").style = 'text-align: left;';
            switch (entity) {
                case 'project':
                    console.log('project');
                    document.getElementById('structInfo').innerHTML = `
                        <div class='StrucAPIInfo'><p class='struct1'><pre class='desc94'></p></pre></div>
                    `;
                    break;
                case 'analysis_preparation':
                    document.getElementById('structInfo').innerHTML = `
                        <div class='StrucAPIInfo'><p class='struct2'><pre class='desc95'></p></pre></div>
                    `;
                    break;
                case 'characteristic':
                    document.getElementById('structInfo').innerHTML = `
                        <div class='StrucAPIInfo'><p class='struct3'><pre class='desc96'></p></pre></div>
                    `;
                    break;
            }

            setLang('');
        }

        setLang('');

    </script>

</body>


</html>
